name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: artemis-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test production build
        run: npm test

      - name: Configure Wrangler OAuth fallback
        env:
          WRANGLER_OAUTH_CONFIG: ${{ secrets.WRANGLER_OAUTH_CONFIG }}
        run: |
          if [ -n "$WRANGLER_OAUTH_CONFIG" ]; then
            umask 077
            mkdir -p "$HOME/.config/.wrangler/config"
            printf '%s' "$WRANGLER_OAUTH_CONFIG" > "$HOME/.config/.wrangler/config/default.toml"
          fi

      - name: Deploy exact revision
        run: npx --no-install wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify public health response
        env:
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          expected_catalog="$(node -p "require('./app/data/catalog.json').version")"
          for attempt in 1 2 3 4 5; do
            actual_catalog="$(curl --fail --silent --show-error --max-time 20 https://artemis.andrewmohawk.xyz/api/healthz | jq -r '.catalogVersion // empty')" || true
            if [ "$actual_catalog" = "$expected_catalog" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Public health check did not report catalog v${expected_catalog}" >&2
          exit 1
